# Fails the build if roxygen docs (man/ or NAMESPACE) drift from source.
# Ported from cranary to catch stale-documentation defects at PR time.
name: docs-current

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docs-current:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::roxygen2
            any::pkgload (>= 1.5.3)

      - name: Regenerate documentation
        run: Rscript -e 'roxygen2::roxygenise()'

      - name: Fail if man/ or NAMESPACE drifted from source
        run: |
          if [ -n "$(git status --porcelain man NAMESPACE)" ]; then
            echo '::error::Documentation is out of date. Run roxygen2::roxygenise() and commit man/ + NAMESPACE.'
            git --no-pager diff -- man NAMESPACE
            exit 1
          fi
